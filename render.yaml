services:
  - type: web
    name: why-the-code-bhoomik
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: SESSION_SECRET
        generateValue: true
      - key: SECURE_SESSION_COOKIE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      - key: ALLOWED_ORIGINS
        value: https://why-the-code-bhoomik.onrender.com
      - key: FRONTEND_URL
        value: https://why-the-code-bhoomik.onrender.com/
      - key: GITHUB_OAUTH_CALLBACK_URL
        value: https://why-the-code-bhoomik.onrender.com/api/auth/github/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
