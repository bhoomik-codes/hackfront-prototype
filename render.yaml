services:
  - type: web
    name: why-the-code-bhoomik
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SECURE_SESSION_COOKIE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      - key: ALLOWED_ORIGINS
        value: https://why-the-code-bhoomik-kqe7.onrender.com
      - key: FRONTEND_URL
        value: https://why-the-code-bhoomik-kqe7.onrender.com/
      - key: GITHUB_OAUTH_CALLBACK_URL
        value: https://why-the-code-bhoomik-kqe7.onrender.com/api/auth/github/callback
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CALLBACK_URL
        value: https://why-the-code-bhoomik-kqe7.onrender.com/api/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM
        sync: false
